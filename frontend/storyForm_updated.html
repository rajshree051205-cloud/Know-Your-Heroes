<!--
  This is NOT a full page — it's your EXISTING <form id="storyForm"> from index.php
  with ONE addition: the hidden honeypot field. Copy just the honeypot <div> below
  into your real form (anywhere inside the <form> tags), then link story-wall.js
  instead of your old localStorage script.
-->

<form id="storyForm" class="story-form reveal" novalidate>
  <div class="field">
    <label for="heroName">Their name</label>
    <input type="text" id="heroName" name="heroName" placeholder="e.g. Havildar Ramesh Chander" required>
  </div>
  <div class="field-row">
    <div class="field">
      <label for="relation">Your relation to them</label>
      <input type="text" id="relation" name="relation" placeholder="e.g. Written by his daughter">
    </div>
    <div class="field">
      <label for="unit">Regiment / Unit <span class="optional">(optional)</span></label>
      <input type="text" id="unit" name="unit" placeholder="e.g. 13 JAK RIF">
    </div>
  </div>
  <div class="field">
    <label for="story">Their story</label>
    <textarea id="story" name="story" rows="5" placeholder="Share a memory, an achievement, or what you want the world to know about them." required></textarea>
  </div>
  <div class="field">
    <label for="submittedBy">Your name</label>
    <input type="text" id="submittedBy" name="submittedBy" placeholder="e.g. Priya P.">
  </div>

  <!-- HONEYPOT — new, hidden from real users, catches bots -->
  <div style="position:absolute; left:-9999px;" aria-hidden="true">
    <label for="website">Leave this field empty</label>
    <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
  </div>

  <button type="submit" class="btn btn-primary">Add to the Memorial Wall</button>
  <p id="storyConfirm" class="story-confirm" role="status" hidden>Thank you — their story now stands on the wall below.</p>
  <p class="story-privacy">Every story here is saved to our database and visible to all visitors.</p>
</form>

<div class="story-wall reveal">
  <div id="storyGrid" class="story-grid"></div>
  <p id="storyEmpty" class="story-empty" hidden>No stories yet — be the first to light a name here.</p>
</div>

<!-- Make sure script.js (containing story-wall.js's code) loads AFTER this markup -->
<script src="script.js"></script>
